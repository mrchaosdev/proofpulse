<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ProofPulse">
  <style>
    /* The two palettes from tokens.css. A favicon cannot read the page's
       variables, so the file carries both and follows the system. */
    .tile-from { stop-color: #ff8ba7; }
    .tile-to { stop-color: #267247; }
    .bars { fill: #fffffe; }
    @media (prefers-color-scheme: dark) {
      .tile-from { stop-color: #8a3fe8; }
      .tile-to { stop-color: #4fc4cf; }
    }
  </style>
  <defs>
    <linearGradient id="proofpulse-icon" x1="0" y1="0" x2="1" y2="1">
      <stop class="tile-from" offset="0" />
      <stop class="tile-to" offset="1" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="10" fill="url(#proofpulse-icon)" />
  <g class="bars">
    <rect x="7" y="11.5" width="4.5" height="9" rx="2.25" />
    <rect x="13.75" y="7.5" width="4.5" height="17" rx="2.25" />
    <rect x="20.5" y="10" width="4.5" height="12" rx="2.25" />
  </g>
</svg>
